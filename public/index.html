<!DOCTYPE html>
<html lang="tr" data-t="bw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>batumedya</title>
<meta name="description" content="batumedya - paylaş, beğen, yorum yap.">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0}
:root,[data-t=bw]{--bg:#000;--cd:#111;--tx:#fff;--mu:#8a8a8a;--pb:#fff;--ax:#000;--bd:#2a2a2a}
[data-t=pink]{--bg:#fff0f6;--cd:#fff;--tx:#4a1230;--mu:#a56a87;--pb:linear-gradient(135deg,#ff7ab8,#ff3d93);--ax:#fff;--bd:#ffc9e2}
[data-t=metal]{--bg:#1f2227;--cd:linear-gradient(145deg,#3d424b,#2a2e35);--tx:#e8ecf1;--mu:#9aa4b2;--pb:linear-gradient(145deg,#f1f4f8,#98a2b0);--ax:#1b1e23;--bd:#4a505a}
body{font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--bd)}
.lg{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;letter-spacing:-.03em;margin-right:auto}
.lg img{width:30px;height:30px}
.auth .lg{margin:0 auto 6px;font-size:34px}.auth .lg img{width:48px;height:48px}
.me{display:flex;align-items:center;gap:6px}
.me .av{width:28px;height:28px;font-size:13px}
img.av{object-fit:cover;background:var(--bd)}
.cm .av{width:24px;height:24px;font-size:11px;flex:none}
.cm .c{display:flex;gap:8px;align-items:flex-start}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin-top:12px}
.avs button{padding:4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mu)}
.avs button img,.avs button span{width:56px;height:56px;border-radius:50%}
.avs button span{display:grid;place-items:center;background:var(--pb);color:var(--ax);font-weight:800;font-size:22px}
.avs button.on{border-color:var(--tx);color:var(--tx)}
.big{width:64px;height:64px;font-size:26px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--mu)}
.tools select{padding:6px 9px}
.tools input[type=range]{width:110px;accent-color:currentColor;padding:0;border:0;background:none}
select,input,textarea{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;outline:none}
main{max-width:600px;margin:0 auto;padding:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
button{cursor:pointer;border:1px solid var(--bd);background:transparent;border-radius:999px;padding:7px 14px}
button.p{background:var(--pb);color:var(--ax);border:0;font-weight:700}
button.on{border-color:var(--tx);font-weight:700}
button:active{transform:scale(.96)}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.hd>div{flex:1}.hd small,small{color:var(--mu);display:block}
.av{width:38px;height:38px;border-radius:50%;background:var(--pb);color:var(--ax);display:grid;place-items:center;font-weight:800}
article p{white-space:pre-wrap;word-break:break-word;margin:4px 0 8px}
article img,.pv{display:block;width:100%;max-height:480px;object-fit:cover;border-radius:12px;margin-bottom:8px;background:var(--bd)}
.ac{display:flex;gap:8px}
.cm{margin-top:10px;border-top:1px solid var(--bd);padding-top:10px}
.cm div{margin-bottom:6px;word-break:break-word}.cm b{margin-right:6px}
.cm form,.row{display:flex;gap:8px;margin-top:8px}.cm input{flex:1;min-width:0}
textarea{width:100%;resize:none;height:80px}
.auth{max-width:340px;margin:12vh auto;padding:0 16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.auth h1{font-size:34px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--pb);color:var(--ax);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
#toast.s{opacity:1}
.g{font-size:14px;padding:5px 12px}
label.f{cursor:pointer;border:1px solid var(--bd);border-radius:999px;padding:7px 14px}
.mk{width:30px;height:30px;flex:none}
.auth .mk{width:48px;height:48px}
.wm{font-weight:800;letter-spacing:-.04em}
.wm i{font-style:normal;background:linear-gradient(90deg,#ff7ab8,#7a5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
header{flex-wrap:wrap}
.bell{position:relative;font-size:20px;line-height:1;padding:4px}
.bell b{position:absolute;top:-4px;right:-6px;min-width:17px;height:17px;border-radius:9px;background:#ff3d6e;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.pt{font-size:20px;margin:6px 2px 12px}
.nt{display:flex;gap:10px;align-items:flex-start}.nt>div{flex:1}.nt.new{border-color:var(--tx)}
.nt .row{margin-top:6px}
.stats{display:flex;gap:22px;margin:10px 0}
.stats>*{display:flex;flex-direction:column;align-items:flex-start;border:0;border-radius:0;padding:0;background:none;font-size:14px;color:var(--mu)}
.stats b{font-size:19px;color:var(--tx)}
.pc{cursor:pointer;position:relative}
.md{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:30;padding:16px}
.md .card{width:100%;max-width:380px;max-height:70vh;overflow:auto;margin:0}
.md a.c{display:flex;align-items:center;gap:10px;padding:6px 0}
.cm .c{display:flex;gap:8px;align-items:flex-start}.cm .c .av{width:26px;height:26px;font-size:12px;flex:none}
img.av{object-fit:cover;background:var(--bd)}
.big{width:64px;height:64px;font-size:26px}
.me .av{width:28px;height:28px;font-size:13px}
.tools label{display:flex;align-items:center;gap:6px}
@media(max-width:480px){.me span{display:none}#th{max-width:120px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T=localStorage.t||'', U=localStorage.u||'', MYPV=+localStorage.pv||0, MYPRIV=localStorage.priv==='1', IMG=null, BT;
const FONTS={sans:['Varsayılan','system-ui,-apple-system,Segoe UI,sans-serif'],serif:['Klasik','Georgia,Times New Roman,serif'],mono:['Daktilo','ui-monospace,Menlo,Consolas,monospace'],round:['Yuvarlak','Trebuchet MS,Verdana,sans-serif']};
const FS_MIN=14,FS_MAX=22;
const clampFs=n=>Math.min(FS_MAX,Math.max(FS_MIN,Math.round(+n||16)));
const fontStyle=(f,s)=>`font-family:${(FONTS[f]||FONTS.sans)[1]};font-size:${clampFs(s)}px`;
const MARK='<svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ab8"/><stop offset="1" stop-color="#7a5cff"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lgm)"/><path d="M23 14v35" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="36" cy="38" r="10.5" fill="none" stroke="#fff" stroke-width="7"/><circle cx="48" cy="16" r="4.5" fill="#fff"/></svg>';
const LOGO=MARK+'<span class="wm">batu<i>medya</i></span>';
function avatar(name,pv,cls='av'){
  return +pv>0?`<img class="${cls}" src="/api?a=pic&u=${encodeURIComponent(name)}&v=${pv}" alt="" width="38" height="38" loading="lazy">`
    :`<span class="${cls}" aria-hidden="true">${esc(String(name)[0].toUpperCase())}</span>`;
}
document.documentElement.dataset.t=localStorage.th||'bw';

function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.i);toast.i=setTimeout(()=>t.className='',2600)}
async function api(a,body){
  const r=await fetch('/api?a='+a,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:JSON.stringify(body||{})});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&T){logout();throw new Error(d.e)}
  if(!r.ok)throw new Error(d.e||'Hata');
  return d;
}
function setMe(d){T=d.t||T;U=d.u||U;MYPV=+d.pv||0;MYPRIV=!!d.priv;localStorage.t=T;localStorage.u=U;localStorage.pv=MYPV;localStorage.priv=MYPRIV?'1':'0'}
function logout(){T=U='';MYPV=0;MYPRIV=false;['t','u','pv','priv','av'].forEach(k=>delete localStorage[k]);go()}
function ago(d){const s=(Date.now()-new Date(d))/1000;return s<60?'şimdi':s<3600?Math.floor(s/60)+' dk':s<86400?Math.floor(s/3600)+' sa':Math.floor(s/86400)+' gün'}

// Fotoğrafı tarayıcıda küçült: lim = en fazla karakter (yaklaşık bayt x1.37), dim = en uzun kenar, sq = kare kırp
function shrink(f,lim,dim,sq){return new Promise((ok,no)=>{
  const i=new Image();
  i.onload=()=>{
    let sx=0,sy=0,sw=i.width,sh=i.height;
    if(sq){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
    let s=Math.min(1,dim/Math.max(sw,sh)),q=.85,d;
    for(let k=0;k<14;k++){
      const c=document.createElement('canvas');c.width=Math.round(sw*s);c.height=Math.round(sh*s);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,sx,sy,sw,sh,0,0,c.width,c.height);
      d=c.toDataURL('image/jpeg',q);
      if(d.length<=lim)return ok(d);
      if(q>.45)q-=.1;else s*=.8;
    }
    no(new Error('Fotoğraf küçültülemedi'))};
  i.onerror=()=>no(new Error('Fotoğraf okunamadı'));
  i.src=URL.createObjectURL(f)})}

function modal(t,h){const d=document.createElement('div');d.className='md';
  d.innerHTML=`<div class="card"><div class="hd"><b>${t}</b><button class="g" data-z>Kapat</button></div>${h}</div>`;
  d.onclick=e=>{if(e.target===d||e.target.closest('[data-z],a'))d.remove()};document.body.appendChild(d)}

function authView(){
  app.innerHTML=`<div class="auth"><h1 class="lg">${LOGO}</h1>
  <input id="u" placeholder="Kullanıcı adı" autocapitalize="none" autocomplete="username">
  <input id="p" type="password" placeholder="Şifre" autocomplete="current-password">
  <button class="p" id="li">Giriş yap</button><button id="rg">Hesap oluştur</button></div>`;
  const send=a=>async()=>{try{setMe(await api(a,{u:$('#u').value,p:$('#p').value}));go()}catch(e){toast(e.message)}};
  $('#li').onclick=send('login');$('#rg').onclick=send('register');
}

const post=p=>`<article class="card" data-id="${p.id}"><div class="hd"><a href="#/${esc(p.username)}" aria-label="@${esc(p.username)} profili">${avatar(p.username,p.pv)}</a>
<div><a href="#/${esc(p.username)}"><b>@${esc(p.username)}</b></a><small>${ago(p.created)}${p.priv?(p.pub?' · 🌍 Herkese açık':' · 🔒 Takipçilere özel'):''}</small></div>${p.username===U?'<button class="g" data-x>Sil</button>':''}</div>
${p.body?`<p style="${fontStyle(p.font,p.fs)}">${esc(p.body)}</p>`:''}${p.hasimg?`<img loading="lazy" src="/api?a=img&id=${p.id}&t=${encodeURIComponent(T)}" alt="">`:''}
<div class="ac"><button data-r="1" class="${p.mine==1?'on':''}">👍 <span>${p.likes}</span></button><button data-r="-1" class="${p.mine==-1?'on':''}">👎 <span>${p.dislikes}</span></button><button data-c>💬 <span>${p.cc}</span></button></div><div class="cm" hidden></div></article>`;

async function loadFeed(h){
  const f=$('#feed');
  try{const l=await api('feed',{u:h||null});f.innerHTML=l.length?l.map(post).join(''):'<p style="text-align:center;color:var(--mu)">Henüz paylaşım yok.</p>'}
  catch(e){toast(e.message)}
}
async function badge(){try{const r=await api('badge'),b=$('#bd');if(b){b.textContent=r.n>9?'9+':r.n;b.hidden=!r.n}}catch(e){}}

async function shell(h){
  const th=document.documentElement.dataset.t;
  app.innerHTML=`<header><a class="lg" href="#" aria-label="batumedya ana sayfa">${LOGO}</a>
  <select id="th" aria-label="Tema"><option value="bw">⚫ Siyah-Beyaz</option><option value="pink">🌸 Pembe</option><option value="metal">🪩 Metalik</option></select>
  <a class="bell" href="#!n" aria-label="Bildirimler">🔔<b id="bd" hidden></b></a>
  <a class="me" href="#/${esc(U)}">${avatar(U,MYPV)}<span>@${esc(U)}</span></a><button class="g" id="lo">Çıkış</button></header><main id="m"></main>`;
  $('#th').value=th;
  $('#th').onchange=e=>{document.documentElement.dataset.t=localStorage.th=e.target.value};
  $('#lo').onclick=logout;
  badge();clearInterval(BT);BT=setInterval(badge,30000);
  const m=$('#m');
  if(h==='!n')return notifView(m);
  if(h)await profileView(m,h);
  else{
    IMG=null;
    const pf=FONTS[localStorage.pf]?localStorage.pf:'sans',ps=clampFs(localStorage.ps);
    m.innerHTML=`<div class="card"><textarea id="tx" maxlength="280" placeholder="Ne düşünüyorsun?" aria-label="Paylaşım metni"></textarea>
    <div class="tools"><label>Yazı tipi <select id="ff">${Object.entries(FONTS).map(([k,v])=>`<option value="${k}" ${k===pf?'selected':''}>${v[0]}</option>`).join('')}</select></label>
    <label>Boyut <input id="fz" type="range" min="${FS_MIN}" max="${FS_MAX}" step="1" value="${ps}"></label><span id="fzv">${ps}px</span>
    ${MYPRIV?'<label><input type="checkbox" id="pb"> 🌍 Herkese açık paylaş</label>':''}</div>
    <img class="pv" id="pv" hidden alt="Seçilen fotoğrafın önizlemesi">
    <div class="row"><label class="f">📷 Fotoğraf<input id="fi" type="file" accept="image/*" hidden></label><button class="p" id="sh" style="margin-left:auto">Paylaş</button></div></div>`;
    $('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{IMG=await shrink(f,2.8e6,1600);$('#pv').src=IMG;$('#pv').hidden=false}catch(x){toast(x.message)}};
    const applyFont=()=>{const f=$('#ff').value,s=clampFs($('#fz').value);$('#tx').style.cssText=fontStyle(f,s);$('#fzv').textContent=s+'px';localStorage.pf=f;localStorage.ps=s};
    $('#ff').onchange=$('#fz').oninput=applyFont;applyFont();
    $('#sh').onclick=async()=>{const b=$('#sh');b.disabled=true;try{await api('post',{body:$('#tx').value,img:IMG,font:$('#ff').value,fs:clampFs($('#fz').value),pub:!!($('#pb')&&$('#pb').checked)});go()}catch(e){toast(e.message);b.disabled=false}};
  }
  m.insertAdjacentHTML('beforeend','<div id="feed"></div>');
  $('#feed').onclick=feedClick;
  loadFeed(h);
}

async function profileView(m,h){
  try{
    const u=await api('user',{u:h}),own=u.own;
    if(own){MYPV=u.pv;MYPRIV=u.priv;localStorage.pv=u.pv;localStorage.priv=u.priv?'1':'0'}
    const av=avatar(u.username,u.pv,'av big');
    m.innerHTML=`<div class="card"><div class="hd">${own?`<label class="pc" title="Profil fotoğrafını değiştir">${av}<input id="pi" type="file" accept="image/*" hidden></label>`:av}<div><b>@${esc(u.username)}</b>${u.priv?' 🔒':''}</div></div>
    <div class="stats"><div><b>${u.posts}</b>paylaşım</div><button data-l="followers"><b>${u.followers}</b>takipçi</button><button data-l="following"><b>${u.following}</b>takip</button></div>
    <p>${esc(u.bio||'')}</p>
    <div class="row" style="flex-wrap:wrap">${own?`<button class="g" id="eb">Bio düzenle</button><button class="g" id="pr">${u.priv?'🔒 Hesap gizli':'🌍 Hesap herkese açık'}</button>${u.pv?'<button class="g" id="pd">Fotoğrafı kaldır</button>':''}`
      :`<button class="${u.st?'':'p '}g" id="fb">${u.st==='accepted'?'Takibi bırak':u.st==='pending'?'İstek gönderildi':'Takip et'}</button>`}</div>
    ${own?`<small style="margin-top:8px">${u.priv?'Gizli hesapta paylaşımlarını sadece takipçilerin görür. Paylaşırken tek tek "Herkese açık" seçebilirsin.':'Herkese açık hesapta herkes paylaşımlarını görür. Gizli yaparsan sadece takipçilerin görür.'}</small>`:''}
    ${u.priv&&!own&&u.st!=='accepted'?'<small style="margin-top:8px">🔒 Bu hesap gizli. Sadece herkese açık paylaşımları görebilirsin.</small>':''}</div>`;
    const fa=async(a,b)=>{try{await api(a,b);go()}catch(e){toast(e.message)}};
    if(own){
      $('#eb').onclick=async()=>{const b=prompt('Biyografin (en fazla 160 karakter):',u.bio||'');if(b!==null)fa('bio',{bio:b})};
      $('#pr').onclick=()=>fa('priv',{v:!u.priv});
      $('#pi').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const pic=await shrink(f,270000,400,true);fa('pic',{pic})}catch(x){toast(x.message)}};
      const pd=$('#pd');if(pd)pd.onclick=()=>fa('pic',{pic:null});
    }else $('#fb').onclick=()=>fa('follow',{u:h});
    m.querySelectorAll('[data-l]').forEach(b=>b.onclick=async()=>{
      try{const l=await api('follows',{u:h,t:b.dataset.l});
        modal(b.dataset.l==='followers'?'Takipçiler':'Takip edilenler',l.length?l.map(x=>`<a class="c" href="#/${esc(x.username)}">${avatar(x.username,x.pv)}<b>@${esc(x.username)}</b></a>`).join(''):'<small>Henüz kimse yok.</small>')}
      catch(e){toast(e.message)}});
  }catch(e){m.innerHTML='<div class="card">Kullanıcı bulunamadı.</div>'}
}

const NT={like:'gönderini beğendi 👍',dislike:'gönderini beğenmedi 👎',comment:'gönderine yorum yaptı 💬',follow:'seni takip etmeye başladı',follow_req:'sana takip isteği gönderdi'};
async function notifView(m){
  m.innerHTML='<h2 class="pt">Bildirimler</h2><div id="nl"></div>';
  try{
    const l=await api('notifs');
    $('#nl').innerHTML=l.length?l.map(n=>`<div class="card nt ${n.seen?'':'new'}"><a href="#/${esc(n.username)}">${avatar(n.username,n.pv)}</a>
      <div><a href="#/${esc(n.username)}"><b>@${esc(n.username)}</b></a> ${NT[n.type]||''}<small>${n.snip?esc(n.snip)+' · ':''}${ago(n.created)}</small>
      ${n.type==='follow_req'&&n.pending?`<div class="row"><button class="p g" data-a="1" data-u="${esc(n.username)}">Kabul et</button><button class="g" data-a="0" data-u="${esc(n.username)}">Reddet</button></div>`:''}</div></div>`).join('')
      :'<p style="text-align:center;color:var(--mu)">Henüz bildirimin yok.</p>';
    $('#nl').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;
      try{await api('followans',{u:b.dataset.u,ok:b.dataset.a==='1'});notifView(m)}catch(x){toast(x.message)}};
    badge();
  }catch(e){toast(e.message)}
}

async function feedClick(e){
  const b=e.target.closest('button');if(!b)return;
  const art=b.closest('article'),id=+art.dataset.id;
  try{
    if(b.dataset.r){
      const r=await api('react',{id,v:+b.dataset.r}),[l,d]=art.querySelectorAll('.ac button');
      l.querySelector('span').textContent=r.likes;d.querySelector('span').textContent=r.dislikes;
      l.classList.toggle('on',r.mine==1);d.classList.toggle('on',r.mine==-1);
    }else if('x' in b.dataset){
      if(confirm('Silinsin mi?')){await api('del',{id});art.remove()}
    }else if('c' in b.dataset){
      const box=art.querySelector('.cm');
      if(!box.hidden){box.hidden=true;return}
      box.hidden=false;await loadComments(art,id);
    }
  }catch(x){toast(x.message)}
}
async function loadComments(art,id){
  const box=art.querySelector('.cm'),l=await api('comments',{id});
  box.innerHTML=l.map(c=>`<div class="c">${avatar(c.username,c.pv)}<div><b>@${esc(c.username)}</b>${esc(c.body)}</div></div>`).join('')+`<form><input maxlength="200" placeholder="Yorum yaz..."><button class="p g">Gönder</button></form>`;
  box.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const i=ev.target.firstChild;if(!i.value.trim())return;
    try{await api('comment',{id,body:i.value});await loadComments(art,id);const s=art.querySelector('.ac [data-c] span');s.textContent=+s.textContent+1}catch(x){toast(x.message)}};
}

function go(){document.querySelectorAll('.md').forEach(d=>d.remove());if(!T)return authView();const r=decodeURIComponent(location.hash.slice(1));shell(r==='!n'?'!n':r.startsWith('/')?r.slice(1):'')}
addEventListener('hashchange',go);
go();
</script>
</body>
</html>
